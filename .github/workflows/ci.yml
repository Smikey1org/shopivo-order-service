name: Shopivo Order Service

on:
  push:
    branches:
      - qa
    paths:
      - "src/**"
      - "requirements.txt"
      - "requirements*.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/ci.yml"

  pull_request:
    branches:
      - qa
    paths:
      - "src/**"
      - "requirements.txt"
      - "requirements*.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/ci.yml"

# Default: minimum permissions
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: ${{ vars.DOCKER_HUB_USERNAME }}/shopivo-order-service

# ============================================================
# SECURITY
# ============================================================

jobs:

  # ----------------------------------------------------------
  # GITLEAKS
  # ----------------------------------------------------------

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --source=/repo \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json \
            --redact \
            --exit-code 1

      - name: Upload Gitleaks Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn
          archive: false

  # ----------------------------------------------------------
  # CHECKOV
  # ----------------------------------------------------------

  checkov:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          pip install checkov

      - name: Checkov Dockerfile Scan
        run: |
          checkov \
            -f Dockerfile \
            --framework dockerfile \
            --output json \
            > checkov-dockerfile-report.json

      - name: Checkov Kubernetes Scan
        run: |
          checkov \
            -d . \
            --framework kubernetes \
            --output json \
            > checkov-k8s-report.json
        continue-on-error: true

      - name: Upload Checkov Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkov-reports
          path: |
            checkov-dockerfile-report.json
            checkov-k8s-report.json
          if-no-files-found: warn
          archive: true

  # ----------------------------------------------------------
  # PYTHON DEPENDENCY VULNERABILITY SCAN
  # ----------------------------------------------------------

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: latest
          cache: true

      - name: Trivy Filesystem Vulnerability Scan
        run: |
          trivy fs . \
            --scanners vuln \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --format json \
            --output trivy-fs-report.json \
            --exit-code 1

      - name: Generate Filesystem SBOM
        if: always()
        run: |
          trivy fs . \
            --scanners vuln \
            --format cyclonedx \
            --output trivy-fs-sbom-cyclonedx.json \
            --exit-code 0

      - name: Upload Trivy Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-fs-reports
          path: |
            trivy-fs-report.json
            trivy-fs-sbom-cyclonedx.json
          if-no-files-found: warn
          archive: true

  # ============================================================
  # QUALITY
  # ============================================================

  # ----------------------------------------------------------
  # PYTHON LINT
  # ----------------------------------------------------------

  lint:
    name: Python Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Ruff
        run: |
          pip install ruff

      - name: Run Ruff
        run: |
          ruff check src

  # ----------------------------------------------------------
  # PYTHON TESTS
  # ----------------------------------------------------------

  test:
    name: FastAPI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Test Dependencies
        run: |
          pip install pytest pytest-cov

      - name: Run Tests
        run: |
          pytest -v --cov=src --cov-report=term-missing

  # ============================================================
  # APPLICATION BUILD
  # ============================================================

  build:
    name: Build FastAPI Application
    runs-on: ubuntu-latest

    needs:
      - lint
      - test
      - gitleaks
      - checkov
      - trivy-fs

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify FastAPI Application
        run: |
          python -c "from src.app import app; print(app.title)"

  # ============================================================
  # DOCKER
  # ============================================================

  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest

    needs:
      - build

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # --------------------------------------------------------
      # IMAGE TAG
      # --------------------------------------------------------

      - name: Generate Image Tag
        id: image-tag
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # DOCKER LOGIN
      # --------------------------------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # --------------------------------------------------------
      # BUILDX
      # --------------------------------------------------------

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # --------------------------------------------------------
      # BUILD IMAGE
      # --------------------------------------------------------

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false

          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.tag }}
            ${{ env.IMAGE_NAME }}:qa

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------------
      # VERIFY PYTHON PACKAGES INSIDE IMAGE
      # --------------------------------------------------------

      - name: Verify Python Package Versions
        run: |
          docker run --rm \
            ${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.tag }} \
            python -c "
          import msgpack
          import setuptools
          import urllib3

          print('msgpack:', msgpack.__version__)
          print('setuptools:', setuptools.__version__)
          print('urllib3:', urllib3.__version__)

          assert tuple(map(int, msgpack.__version__.split('.'))) >= (1, 2, 1)
          assert tuple(map(int, setuptools.__version__.split('.'))) >= (78, 1, 1)
          assert tuple(map(int, urllib3.__version__.split('.'))) >= (2, 8, 0)
          "

      # --------------------------------------------------------
      # TRIVY IMAGE SCAN
      # --------------------------------------------------------

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: latest
          cache: true

      - name: Scan Docker Image
        run: |
          trivy image \
            --scanners vuln \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            ${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.tag }}

      # --------------------------------------------------------
      # IMAGE SBOM
      # --------------------------------------------------------

      - name: Generate Image SBOM
        if: always()
        run: |
          trivy image \
            --scanners vuln \
            --format cyclonedx \
            --output image-sbom-cyclonedx.json \
            --exit-code 0 \
            ${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.tag }}

      - name: Upload Image SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-sbom
          path: image-sbom-cyclonedx.json
          if-no-files-found: warn
          archive: false

      # --------------------------------------------------------
      # PUSH IMAGE
      # --------------------------------------------------------

      - name: Push Docker Image
        run: |
          docker push \
            ${{ env.IMAGE_NAME }}:${{ steps.image-tag.outputs.tag }}

          docker push \
            ${{ env.IMAGE_NAME }}:qa
